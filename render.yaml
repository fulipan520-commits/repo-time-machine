services:
  - type: web
    name: repo-time-machine-api-520
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BUNDLE_DIRECTORY
        value: /tmp/bundles
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
      - key: MAX_ANALYSIS_DURATION_MS
        value: "600000"
      - key: ANALYSIS_RATE_LIMIT
        value: "8"
      - key: ANALYSIS_RATE_WINDOW_MS
        value: "60000"
      - key: MAX_OUTSTANDING_JOBS
        value: "4"

  - type: web
    name: repo-time-machine-web-520
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: repo-time-machine-api-520
          property: host
